<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text Similarity</title>
<style>
  :root {
    --bg: #1D1D1D;          /* same fill as the frame in the video, so the recording blends in */
    --panel: #262626;
    --line: #3A3A3A;
    --text: #FFFFFF;
    --text-dim: #CCCCCC;
    --muted: #8A8A8A;
    --pink: #E66ECC;
    --blue: #91D6FE;
    --green: #89D6BC;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  main { width: 100%; max-width: 1240px; padding: 16px 32px; }

  .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .side { min-width: 0; }
  label, .caption {
    display: block;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .02em;
    margin-bottom: 8px;
  }
  .side.a label { color: var(--pink); }
  .side.b label { color: var(--blue); }
  .caption { color: var(--text-dim); font-weight: 500; margin: 16px 0 6px; }

  textarea {
    width: 100%;
    height: 84px;
    resize: none;
    padding: 12px 14px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    font: 22px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    outline: none;
  }
  .side.a textarea:focus { border-color: var(--pink); }
  .side.b textarea:focus { border-color: var(--blue); }

  .embedding {
    min-height: 50px;
    max-height: 132px;
    overflow-y: auto;
    padding: 12px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    font: 18px/1.4 var(--mono);
    color: var(--text-dim);
    white-space: nowrap;
  }
  .embedding.full { white-space: normal; font-size: 13px; word-spacing: -2px; }
  .embedding .value { animation: fade .35s ease-out; }
  .meta {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 13px;
    color: var(--muted);
  }
  .toggle {
    background: none;
    border: 0;
    padding: 0;
    color: var(--muted);
    font: inherit;
    text-decoration: underline;
    cursor: pointer;
  }
  .toggle:hover { color: var(--text-dim); }
  .toggle[hidden] { display: none; }

  .actions { display: flex; justify-content: center; margin: 24px 0 16px; }
  #calculate {
    padding: 12px 44px;
    background: var(--pink);
    color: #1D1D1D;
    border: 0;
    border-radius: 999px;
    font: 600 18px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    cursor: pointer;
  }
  #calculate:hover { filter: brightness(1.08); }
  #calculate:disabled { cursor: default; }

  /* Space is reserved before the first click, so nothing jumps when the result appears. */
  .result { min-height: 128px; text-align: center; }
  .score-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    min-height: 64px;
  }
  .score-line.shown { animation: fade .35s ease-out; }
  .score-label { color: var(--text-dim); font-size: 16px; }
  .score {
    position: relative;
    font: 600 52px/1 var(--mono);
    color: var(--text);
    cursor: default;
  }
  /* Hover shows three decimals. */
  .score:hover::after {
    content: attr(data-precise);
    position: absolute;
    left: 50%;
    bottom: calc(100% + 8px);
    transform: translateX(-50%);
    padding: 4px 10px;
    background: #000;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 16px;
    font-weight: 500;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .tag {
    padding: 6px 16px;
    border-radius: 999px;
    border: 1px solid currentColor;
    font-size: 17px;
    font-weight: 600;
  }
  .tag.band-0 { color: var(--green); }
  .tag.band-mid { color: var(--blue); }
  .tag.band-last { color: var(--muted); }

  .legend { margin-top: 14px; font-size: 13px; color: var(--muted); }
  .legend .bands span + span::before { content: "·"; margin: 0 10px; color: var(--line); }
  .legend .bands b { font-weight: 600; font-family: var(--mono); }
  .legend .bands .band-0 b { color: var(--green); }
  .legend .bands .band-mid b { color: var(--blue); }
  .legend .question { margin-top: 4px; font-style: italic; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  @media (max-width: 720px) {
    main { padding: 16px; }
    .columns { grid-template-columns: 1fr; gap: 20px; }
    .embedding { font-size: 15px; }
  }
</style>
</head>
<body>
<main>
  <div class="columns">
    <section class="side a">
      <label for="text-a">Text A</label>
      <textarea id="text-a" spellcheck="false">vacation days per year</textarea>
      <div class="caption">Embeddings</div>
      <div class="embedding" id="emb-a" aria-live="polite"></div>
      <div class="meta"><span>384 dimensions</span><button class="toggle" data-for="a" hidden>show all 384</button></div>
    </section>
    <section class="side b">
      <label for="text-b">Text B</label>
      <textarea id="text-b" spellcheck="false">annual leave</textarea>
      <div class="caption">Embeddings</div>
      <div class="embedding" id="emb-b" aria-live="polite"></div>
      <div class="meta"><span>384 dimensions</span><button class="toggle" data-for="b" hidden>show all 384</button></div>
    </section>
  </div>

  <div class="actions"><button id="calculate">Calculate</button></div>

  <div class="result">
    <div class="score-line" id="score-line" aria-live="polite"></div>
    <div class="legend">
      <div class="bands" id="bands"></div>
      <div class="question">These cut-offs are a choice, not the model's. Where would you draw the line?</div>
    </div>
  </div>
</main>

<script>
  const MINUS = "−"; // a real minus sign "−", not a hyphen

  // Same rules as clip() in embed.py: two decimals, explicit sign, and −0.00 shown as 0.00.
  function formatNumber(x, signed) {
    const text = Math.abs(x).toFixed(2);
    if (text === "0.00") return text;
    if (x < 0) return MINUS + text;
    return (signed ? "+" : "") + text;
  }
  function clipped(vector) {
    const first = vector.slice(0, 3).map(x => formatNumber(x, true));
    return "[" + first.join(", ") + ", …, " + formatNumber(vector[vector.length - 1], true) + "]";
  }
  function full(vector) {
    return "[" + vector.map(x => formatNumber(x, true)).join(", ") + "]";
  }

  const $ = id => document.getElementById(id);
  const vectors = { a: null, b: null };
  const expanded = { a: false, b: false };
  let bands = [];

  // Colour class for a band: first band green, last band grey, anything between blue.
  function bandClass(index) {
    if (index === 0) return "band-0";
    if (index === bands.length - 1) return "band-last";
    return "band-mid";
  }

  // The legend is built from BANDS in main.py, so changing a cut-off there updates it here.
  async function loadBands() {
    bands = await (await fetch("/api/bands")).json();
    $("bands").innerHTML = bands.map((band, i) => {
      let range;
      if (i === 0) range = "≥ " + band.cutoff.toFixed(2);
      else if (band.cutoff === null) range = "< " + bands[i - 1].cutoff.toFixed(2);
      else range = band.cutoff.toFixed(2) + "–" + (bands[i - 1].cutoff - 0.01).toFixed(2);
      return `<span class="${bandClass(i)}"><b>${range}</b> ${band.label}</span>`;
    }).join("");
  }

  function renderEmbedding(side) {
    const box = $("emb-" + side);
    const toggle = document.querySelector(`.toggle[data-for="${side}"]`);
    const vector = vectors[side];
    if (!vector) {
      box.innerHTML = "";
      box.classList.remove("full");
      toggle.hidden = true;
      return;
    }
    box.innerHTML = `<span class="value">${expanded[side] ? full(vector) : clipped(vector)}</span>`;
    box.classList.toggle("full", expanded[side]);
    box.scrollTop = 0;
    toggle.hidden = false;
    toggle.textContent = expanded[side] ? "show first 3 + last" : "show all 384";
  }

  function renderScore(similarity, label) {
    const line = $("score-line");
    const index = bands.findIndex(b => b.label === label);
    const shown = formatNumber(similarity, false);
    const precise = Math.abs(similarity).toFixed(3) === "0.000" ? "0.000"
      : (similarity < 0 ? MINUS : "") + Math.abs(similarity).toFixed(3);
    line.innerHTML =
      `<span class="score-label">cosine similarity</span>` +
      `<span class="score" data-precise="${precise}">${shown}</span>` +
      `<span class="tag ${bandClass(index)}">${label}</span>`;
    line.classList.remove("shown");
    void line.offsetWidth; // restart the fade on every click
    line.classList.add("shown");
  }

  function clearResult() {
    vectors.a = vectors.b = null;
    renderEmbedding("a");
    renderEmbedding("b");
    $("score-line").innerHTML = "";
  }

  async function calculate() {
    const button = $("calculate");
    button.disabled = true;
    try {
      const response = await fetch("/api/similarity", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        // Sent exactly as typed: no trimming, no lower-casing.
        body: JSON.stringify({ a: $("text-a").value, b: $("text-b").value }),
      });
      const result = await response.json();
      vectors.a = result.a.embedding;
      vectors.b = result.b.embedding;
      renderEmbedding("a");
      renderEmbedding("b");
      renderScore(result.similarity, result.label);
    } finally {
      button.disabled = false;
    }
  }

  $("calculate").addEventListener("click", calculate);
  for (const id of ["text-a", "text-b"]) {
    // Editing a text makes the old result wrong, so clear it.
    $(id).addEventListener("input", clearResult);
    // Ctrl/Cmd + Enter also calculates.
    $(id).addEventListener("keydown", e => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); calculate(); }
    });
  }
  document.querySelectorAll(".toggle").forEach(toggle =>
    toggle.addEventListener("click", () => {
      const side = toggle.dataset.for;
      expanded[side] = !expanded[side];
      renderEmbedding(side);
    })
  );

  loadBands();
</script>
</body>
</html>
